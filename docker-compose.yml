version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - internal

  dispatcher:
    build: ./dispatcher/Dispatcher
    container_name: dispatcher
    ports:
      - "5100:8080"
    depends_on:
      - mongodb
    networks:
      - internal
      - external

  auth-service:
    build: ./auth-service/AuthService
    container_name: auth-service
    depends_on:
      - mongodb
    networks:
      - internal

  product-service:
    build: ./product-service/ProductService
    container_name: product-service
    depends_on:
      - mongodb
    networks:
      - internal

  order-service:
    build: ./user-service/UserService
    container_name: order-service
    depends_on:
      - mongodb
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - internal
      - external
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - internal
      - external

volumes:
  mongo_data:

networks:
  internal:
    internal: true
  external:
    internal: false
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Dispatcher Log Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { color: #00d4ff; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #16213e; color: #00d4ff; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        tr:hover { background: #16213e; }
        .status-200 { color: #00ff88; }
        .status-401 { color: #ff6b6b; }
        .status-404 { color: #ffd93d; }
        .status-500 { color: #ff0000; }
        .refresh-btn { 
            background: #00d4ff; color: #000; border: none; 
            padding: 10px 20px; cursor: pointer; border-radius: 5px;
            font-size: 16px; margin-bottom: 20px;
        }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #16213e; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
        .stat-number { font-size: 2em; color: #00d4ff; }
    </style>
</head>
<body>
    <h1>🚀 Dispatcher Log Dashboard</h1>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="total">-</div>
            <div>Toplam İstek</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="success">-</div>
            <div>Başarılı (2xx)</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="error">-</div>
            <div>Hatalı (4xx/5xx)</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="last-update">-</div>
            <div>Son Güncelleme</div>
        </div>
    </div>

    <button class="refresh-btn" onclick="fetchLogs()">🔄 Yenile</button>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Zaman</th>
                <th>Metot</th>
                <th>Path</th>
                <th>Durum Kodu</th>
            </tr>
        </thead>
        <tbody id="log-table"></tbody>
    </table>

    <script>
        const TOKEN_KEY = 'dispatcher_token';

        async function login() {
            const res = await fetch('http://localhost:5100/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'test@test.com', password: '123456' })
            });
            const data = await res.json();
            localStorage.setItem(TOKEN_KEY, data.token);
            return data.token;
        }

        async function fetchLogs() {
            let token = localStorage.getItem(TOKEN_KEY);
            if (!token) token = await login();

            const res = await fetch('http://localhost:5100/dispatcher/logs', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 401) {
                token = await login();
                return fetchLogs();
            }

            const logs = await res.json();
            
            document.getElementById('total').textContent = logs.length;
            document.getElementById('success').textContent = logs.filter(l => l.statusCode >= 200 && l.statusCode < 300).length;
            document.getElementById('error').textContent = logs.filter(l => l.statusCode >= 400).length;
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('tr-TR');

            const tbody = document.getElementById('log-table');
            tbody.innerHTML = '';
            logs.forEach((log, i) => {
                const statusClass = `status-${Math.floor(log.statusCode / 100) * 100}`;
                const time = new Date(log.timestamp).toLocaleString('tr-TR');
                tbody.innerHTML += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${time}</td>
                        <td><b>${log.method}</b></td>
                        <td>${log.path}</td>
                        <td class="${statusClass}">${log.statusCode}</td>
                    </tr>
                `;
            });
        }

        fetchLogs();
        setInterval(fetchLogs, 10000);
    </script>
</body>
</html>
